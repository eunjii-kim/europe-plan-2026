<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>2026 유럽여행</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-actions">
      <button type="button" id="editModeToggle" class="icon-toggle-button" aria-label="편집 모드 전환" aria-pressed="false"></button>
      <button type="button" id="themeToggle" class="icon-toggle-button" aria-label="라이트/다크 모드 전환"></button>
    </div>
    <h1 id="tripTitle"></h1>
    <p id="tripSub" class="trip-sub"></p>
    <div class="dday-row">
      <p id="ddayLabel" class="dday"></p>
      <p id="headerRateStatus" class="header-rate-compact"></p>
    </div>
  </header>

  <nav class="tab-bar" role="tablist">
    <button type="button" class="tab-button" data-tab="schedule" aria-selected="true">일정</button>
    <button type="button" class="tab-button" data-tab="budget" aria-selected="false">예산</button>
    <button type="button" class="tab-button" data-tab="info" aria-selected="false">정보</button>
    <button type="button" class="tab-button" data-tab="expense" aria-selected="false">소비기록</button>
    <button type="button" class="tab-button" data-tab="checklist" aria-selected="false">체크리스트</button>
  </nav>

  <main>
    <section id="scheduleTab" class="tab-panel">
      <div class="schedule-toolbar">
        <button type="button" id="expandAllButton" class="toolbar-button">모두 펼치기</button>
        <button type="button" id="collapseAllButton" class="toolbar-button">모두 접기</button>
      </div>
      <nav id="dayNav" class="day-nav" aria-label="날짜 이동"></nav>
      <div id="dayList" class="day-list"></div>
    </section>

    <section id="budgetTab" class="tab-panel" hidden>
      <p id="rateStatus" class="rate-status"></p>

      <div class="budget-summary">
        <h2>예정 비용 (1인 기준)</h2>
        <div id="categoryBreakdown" class="category-breakdown"></div>
        <p id="plannedTotal" class="total-line"></p>
      </div>

      <div class="budget-custom">
        <h2>추가 필요 예산</h2>
        <p class="hint">여기 추가한 항목은 다른 기기와 실시간으로 공유됩니다.</p>
        <p id="firebaseNotice" class="firebase-notice" hidden></p>

        <form id="budgetForm" class="budget-form">
          <input id="budgetTitleInput" type="text" placeholder="항목명 (예: 기념품)" required maxlength="100" />
          <input id="budgetAmountInput" type="number" placeholder="금액" required min="0" step="1" />
          <select id="budgetCurrencyInput">
            <option value="KRW">KRW</option>
            <option value="EUR">EUR</option>
            <option value="CHF">CHF</option>
          </select>
          <button type="submit">추가</button>
        </form>

        <ul id="budgetList" class="budget-list"></ul>
        <p id="customTotal" class="total-line"></p>
      </div>

      <p id="grandTotal" class="grand-total"></p>
    </section>

    <section id="infoTab" class="tab-panel" hidden>
      <p class="hint">조사한 맛집·카페·쇼핑 정보를 추가하면 다른 기기와 실시간으로 공유됩니다.</p>
      <p class="firebase-notice" hidden></p>

      <div id="placeFilters" class="place-filters"></div>

      <form id="placeForm" class="place-form">
        <select id="placeCategoryInput" aria-label="분류">
          <option value="맛집">맛집</option>
          <option value="카페">카페</option>
          <option value="쇼핑">쇼핑</option>
          <option value="기타">기타</option>
        </select>
        <select id="placeRegionInput" aria-label="지역"></select>
        <input id="placeTitleInput" type="text" placeholder="이름 (예: OO 레스토랑)" required maxlength="100" />
        <input id="placeLinkInput" type="url" placeholder="링크 (선택)" />
        <input id="placeMemoInput" type="text" placeholder="메모 (선택)" maxlength="200" />
        <button type="submit">추가</button>
      </form>

      <ul id="placeList" class="place-list"></ul>
    </section>

    <section id="expenseTab" class="tab-panel" hidden>
      <p class="hint">여행 중 실제로 쓴 금액을 기록하면 예정 비용과 비교한 통계를 볼 수 있습니다.</p>
      <p class="firebase-notice" hidden></p>

      <div id="expenseStats" class="expense-stats"></div>

      <form id="expenseForm" class="expense-form">
        <input id="expenseDateInput" type="date" required />
        <select id="expenseCategoryInput" aria-label="분류">
          <option value="식비">식비</option>
          <option value="교통">교통</option>
          <option value="숙소">숙소</option>
          <option value="쇼핑">쇼핑</option>
          <option value="입장료/투어">입장료/투어</option>
          <option value="기타">기타</option>
        </select>
        <select id="expenseRegionInput" aria-label="지역"></select>
        <input id="expenseTitleInput" type="text" placeholder="항목명 (선택)" maxlength="100" />
        <input id="expenseAmountInput" type="number" placeholder="금액" required min="0" step="1" />
        <select id="expenseCurrencyInput" aria-label="화폐">
          <option value="KRW">KRW</option>
          <option value="EUR">EUR</option>
          <option value="CHF">CHF</option>
        </select>
        <button type="submit">기록</button>
      </form>

      <ul id="expenseList" class="expense-list"></ul>
    </section>

    <section id="checklistTab" class="tab-panel" hidden>
      <p class="hint">준비물을 섹션별로 나눠 체크리스트로 관리하면 다른 기기와 실시간으로 공유됩니다.</p>
      <p class="firebase-notice" hidden></p>

      <form id="checklistSectionForm" class="checklist-section-form">
        <input id="checklistSectionTitleInput" type="text" placeholder="섹션 이름 (예: 의류)" required maxlength="50" />
        <button type="submit">섹션 추가</button>
      </form>

      <div id="checklistSectionList" class="checklist-section-list"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
